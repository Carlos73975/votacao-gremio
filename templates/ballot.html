{% extends "base.html" %}{% block content %}<section class="hero"><span class="eyebrow">CÉDULA DE VOTAÇÃO</span><h1>Escolha sua<br><em>chapa.</em></h1><p>Marque somente uma opção. Sua escolha não será exibida junto ao seu código.</p></section>
<form class="panel" method="post" action="{{url_for('cast')}}" onsubmit="return confirm('Confirma seu voto? Depois de confirmado, não será possível alterá-lo.');"><input type="hidden" name="csrf" value="{{csrf}}"><div class="choices">{% for c in chapas %}<label class="choice"><input type="radio" name="choice" value="{{c}}" required><span class="radio"></span><strong>{{c}}</strong></label>{% endfor %}</div><button>Confirmar voto <span>→</span></button></form>{% endblock %}
